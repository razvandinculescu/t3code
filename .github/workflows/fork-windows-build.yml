name: Fork macOS Build cd03f1f3b
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build macOS arm64
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cd03f1f3b4d89766a81e72364699e316f3b4e870
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...
      - uses: dtolnay/rust-toolchain@stable
      - name: Build desktop artifact
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: vp run dist:desktop:dmg:arm64
      - name: Verify source identity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t3-macos-mount"
          hdiutil attach release/*.dmg -mountpoint "$RUNNER_TEMP/t3-macos-mount" -nobrowse -readonly
          apps=("$RUNNER_TEMP/t3-macos-mount/"*.app)
          test -d "${apps[0]}"
          scripts/node_modules/.bin/asar extract-file "${apps[0]}/Contents/Resources/app.asar" package.json
          node -e 'const p=require("./package.json"); if(p.t3codeCommitHash!=="cd03f1f3b4d8") throw Error("source mismatch"); console.log(p.t3codeCommitHash)'
          hdiutil detach "$RUNNER_TEMP/t3-macos-mount"
      - uses: actions/upload-artifact@v7
        with:
          name: t3code-macos-cd03f1f3b
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
          if-no-files-found: error
          retention-days: 14
