name: Fork macOS Build fb8da1d35
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build macOS arm64
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fb8da1d35578606e7adb4d2900182690dd73167a
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...
      - uses: dtolnay/rust-toolchain@stable
      - name: Build desktop artifact
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: vp run dist:desktop:dmg:arm64
      - name: Verify source identity and signature state
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t3-macos-mount"
          hdiutil attach release/*.dmg -mountpoint "$RUNNER_TEMP/t3-macos-mount" -nobrowse -readonly
          app="$RUNNER_TEMP/t3-macos-mount/T3 Code (Alpha).app"
          test -d "$app"
          scripts/node_modules/.bin/asar extract-file "$app/Contents/Resources/app.asar" package.json
          node -e 'const p=require("./package.json"); if (p.t3codeCommitHash !== "fb8da1d35578") throw new Error(JSON.stringify(p)); console.log(p.t3codeCommitHash)'
          codesign -dvv "$app" 2>&1 || true
          shasum -a 256 release/*.dmg
          hdiutil detach "$RUNNER_TEMP/t3-macos-mount"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: t3code-macos-fb8da1d35
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
          if-no-files-found: error
          retention-days: 14
