name: Fork iOS Native Build
run-name: "iOS ${{ inputs.source-ref }} (${{ inputs.build-number }})"
on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Exact fork source commit
        required: true
        type: string
      build-number:
        description: Numeric CFBundleVersion
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    name: Build unsigned iOS arm64
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
              - --filter=@t3tools/scripts...
      - name: Test native fixes and Hermes fallback
        run: vp test run apps/mobile/scripts/notification-center-manager.test.ts apps/mobile/scripts/permissions-service.test.ts apps/mobile/src/lib/runtimePolyfills.test.ts
      - name: Generate native iOS project
        env:
          T3_IOS_BUILD_NUMBER: ${{ inputs.build-number }}
          APP_VARIANT: production
          T3CODE_IOS_PERSONAL_TEAM: '1'
          T3CODE_IOS_PERSONAL_TEAM_BUNDLE_ID: ro.razvandinculescu.t3code
          EXPO_NO_GIT_STATUS: '1'
        run: |
          set -euo pipefail
          [[ "$T3_IOS_BUILD_NUMBER" =~ ^[0-9]{1,18}$ ]] || exit 2
          xcodebuild -version
          df -h /
          cd apps/mobile
          vp exec expo prebuild --clean --platform ios
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $T3_IOS_BUILD_NUMBER" ios/T3CodeFork/Info.plist
      - name: Build iOS app
        env:
          T3_IOS_BUILD_NUMBER: ${{ inputs.build-number }}
          APP_VARIANT: production
          T3CODE_IOS_PERSONAL_TEAM: '1'
          T3CODE_IOS_PERSONAL_TEAM_BUNDLE_ID: ro.razvandinculescu.t3code
        run: |
          set -euo pipefail
          export NODE_BINARY="$(command -v node)"
          cd apps/mobile/ios
          xcodebuild -workspace T3CodeFork.xcworkspace -scheme T3CodeFork \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/t3-ios-build" -jobs 3 \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            CLANG_ENABLE_MODULE_DEBUGGING=NO DEBUG_INFORMATION_FORMAT=dwarf \
            CURRENT_PROJECT_VERSION="$T3_IOS_BUILD_NUMBER" build > "$RUNNER_TEMP/t3-ios-build.log" 2>&1
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/t3-ios-build/Build/Products/Release-iphoneos/T3CodeFork.app" \
            "$RUNNER_TEMP/T3-Code-Fork-iOS-unsigned.zip"
      - name: Upload unsigned app
        uses: actions/upload-artifact@v7
        with:
          name: t3code-ios-unsigned
          path: ${{ runner.temp }}/T3-Code-Fork-iOS-unsigned.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t3code-ios-log
          path: ${{ runner.temp }}/t3-ios-build.log
          if-no-files-found: ignore
          retention-days: 7
