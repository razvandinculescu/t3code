name: Fork iOS Native Build
run-name: "iOS ${{ inputs.source-ref }} (${{ inputs.build-number }})"
on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Exact fork source commit
        required: true
        type: string
      build-number:
        description: Numeric CFBundleVersion
        required: true
        type: string
      clean-native:
        description: Ignore the generated project and Xcode cache
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: fork-ios-release
  cancel-in-progress: false
jobs:
  build:
    name: Build unsigned iOS arm64
    runs-on: macos-26
    timeout-minutes: 75
    env:
      APP_VARIANT: production
      T3CODE_IOS_PERSONAL_TEAM: "1"
      T3CODE_IOS_PERSONAL_TEAM_BUNDLE_ID: ro.razvandinculescu.t3code
      EXPO_NO_GIT_STATUS: "1"
      # Bump for changes to device Release build settings or the native cache layout.
      T3_IOS_CACHE_VERSION: v2
      T3_IOS_BUILD_NUMBER: ${{ inputs.build-number }}
      USE_CCACHE: "1"
      CCACHE_MAXSIZE: 2G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
              - --filter=@t3tools/scripts...
      - name: Prepare compiler cache and toolchain identity
        id: toolchain
        run: |
          set -euo pipefail
          [[ "$T3_IOS_BUILD_NUMBER" =~ ^[0-9]{1,18}$ ]]
          if ! command -v ccache >/dev/null; then brew install ccache; fi
          config=$(cd apps/mobile && node -p 'require("node:path").join(require("node:path").dirname(require.resolve("react-native/package.json")), "scripts/xcode/ccache.conf")')
          cache_dir=$(env -u CCACHE_DIR CCACHE_CONFIGPATH="$config" ccache --get-config cache_dir)
          echo "CCACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
          printf 'React Native compiler cache: %s\n' "$cache_dir"
          ccache --version
          xcodebuild -version
          sysctl -n hw.ncpu hw.memsize
          echo "jobs=$(sysctl -n hw.ncpu)" >> "$GITHUB_OUTPUT"
          identity=$( { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; uname -m; pwd; pod --version; node --version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Restore enriched Markdown native assets
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          node node_modules/react-native-enriched-markdown/postinstall.mjs
          test -f node_modules/react-native-enriched-markdown/ios/vendor/.stamp
      - name: Test mobile startup and release validation
        run: |
          (cd scripts && vp test run --config ../vite.config.ts fork-ios-build.test.ts)
          (cd apps/mobile && vp test run src/features/updates/app-updates.native-import.test.ts src/features/updates/app-updates.test.ts src/lib/runtimePolyfills.test.ts)
      - name: Compute production native fingerprint
        id: fingerprint
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require('node:fs');
          const f = require('expo/fingerprint');
          f.createFingerprintAsync(process.cwd(), {
            platforms: ['ios'], silent: true, ignorePaths: ['android/**', 'ios/**'],
            sourceSkips: f.DEFAULT_SOURCE_SKIPS & ~f.SourceSkips.ExpoConfigVersions & ~f.SourceSkips.ExpoConfigExtraSection,
          }).then(fp => {
            if (!/^[a-f0-9]{40,64}$/.test(fp.hash)) throw Error('Invalid native fingerprint');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `hash=${fp.hash}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `T3_IOS_NATIVE_FINGERPRINT=${fp.hash}\n`);
            console.log(`Production iOS native fingerprint: ${fp.hash}`);
          }).catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - name: Restore native project and Xcode outputs
        id: native_cache
        if: inputs.clean-native != true
        uses: actions/cache/restore@v6
        with:
          path: |
            apps/mobile/ios
            ${{ runner.temp }}/t3-ios-build
          key: fork-ios-native-${{ env.T3_IOS_CACHE_VERSION }}-${{ steps.toolchain.outputs.identity }}-${{ steps.fingerprint.outputs.hash }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            fork-ios-native-${{ env.T3_IOS_CACHE_VERSION }}-${{ steps.toolchain.outputs.identity }}-${{ steps.fingerprint.outputs.hash }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Restore compiler cache
        id: compiler_cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: fork-ios-ccache-${{ env.T3_IOS_CACHE_VERSION }}-${{ steps.toolchain.outputs.identity }}-${{ steps.fingerprint.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            fork-ios-ccache-${{ env.T3_IOS_CACHE_VERSION }}-${{ steps.toolchain.outputs.identity }}-${{ steps.fingerprint.outputs.hash }}-
            fork-ios-ccache-${{ env.T3_IOS_CACHE_VERSION }}-${{ steps.toolchain.outputs.identity }}-
      - name: Verify compiler cache storage before building
        run: |
          set -euo pipefail
          wrapper=$(cd apps/mobile && node -p 'require("node:path").join(require("node:path").dirname(require.resolve("react-native/package.json")), "scripts/xcode/ccache-clang.sh")')
          printf 'int t3_cache_probe(void) { return 17; }\n' > "$RUNNER_TEMP/t3-cache-probe.c"
          ccache --zero-stats
          for attempt in 1 2; do
            env -u CCACHE_DIR -u CCACHE_MAXSIZE -u CCACHE_BASEDIR -u CCACHE_COMPILERCHECK -u CCACHE_CONFIGPATH \
              CCACHE_BINARY="$(command -v ccache)" "$wrapper" \
              -target arm64-apple-ios18.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
              -c "$RUNNER_TEMP/t3-cache-probe.c" -o "$RUNNER_TEMP/t3-cache-probe.o"
          done
          ccache --show-stats
          hits=$(ccache --print-stats | awk '$1 == "direct_cache_hit" || $1 == "preprocessed_cache_hit" { hits += $2 } END { print hits + 0 }')
          [[ "$hits" -gt 0 ]] || { echo 'Compiler cache storage does not match the React Native wrapper.' >&2; exit 1; }
      - name: Prepare native project
        id: project
        env:
          NATIVE_CACHE_KEY: ${{ steps.native_cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          if [[ -n "$NATIVE_CACHE_KEY" ]] && [[ -d apps/mobile/ios/T3CodeFork.xcworkspace ]] && [[ -d "$RUNNER_TEMP/t3-ios-build/Build/Products/Release-iphoneos/T3CodeFork.app" ]]; then
            echo 'Reusing the matching production native project and Xcode outputs.'
            echo 'native-cache-hit=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Preparing a clean native project; compiler cache remains available.'
            echo 'native-cache-hit=false' >> "$GITHUB_OUTPUT"
            rm -rf apps/mobile/ios "$RUNNER_TEMP/t3-ios-build"
            (cd apps/mobile && vp exec expo prebuild --clean --platform ios --no-install)
          fi
          # Podspecs also regenerate native sources in the fresh node_modules tree, including SQLite.
          (cd apps/mobile/ios && pod install)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $T3_IOS_BUILD_NUMBER" apps/mobile/ios/T3CodeFork/Info.plist
          printf 'export NODE_BINARY=%q\n' "$(command -v node)" > apps/mobile/ios/.xcode.env.local
          ccache --zero-stats
      - name: Normalize and validate generated app images
        run: |
          set -euo pipefail
          catalog=apps/mobile/ios/T3CodeFork/Images.xcassets
          for image in "$catalog"/SplashScreenLogo.imageset/*.png; do
            sips -s format png "$image" --out "${image}.normalized.png"
            mv "${image}.normalized.png" "$image"
          done
          mkdir -p "$RUNNER_TEMP/t3-asset-preflight"
          xcrun actool "$catalog" apps/mobile/ios/T3CodeFork/app-icon.icon \
            --compile "$RUNNER_TEMP/t3-asset-preflight" --platform iphoneos \
            --minimum-deployment-target 18.0 --target-device iphone --target-device ipad \
            --app-icon app-icon --output-partial-info-plist "$RUNNER_TEMP/t3-asset-preflight/info.plist" \
            --output-format human-readable-text
      - name: Verify native module discovery before compilation
        run: vp run check:mobile:modules
      - name: Build iOS app with live diagnostics
        id: native
        run: |
          set -euo pipefail
          export NODE_BINARY="$(command -v node)"
          app="$RUNNER_TEMP/t3-ios-build/Build/Products/Release-iphoneos/T3CodeFork.app"
          # The native cache must never supply the JavaScript for this release.
          rm -f "$app/main.jsbundle" "$app/ExpoWidgets.bundle/ExpoWidgets.bundle" "$app/ExpoWidgets.bundle/ExpoWidgetsLayoutRegistry.json"
          node -p 'Date.now()' > "$RUNNER_TEMP/t3-ios-build-started-at"
          cd apps/mobile/ios
          xcodebuild -workspace T3CodeFork.xcworkspace -scheme T3CodeFork \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/t3-ios-build" -jobs '${{ steps.toolchain.outputs.jobs }}' \
            -showBuildTimingSummary CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            CLANG_ENABLE_MODULE_DEBUGGING=NO DEBUG_INFORMATION_FORMAT=dwarf \
            CURRENT_PROJECT_VERSION="$T3_IOS_BUILD_NUMBER" build 2>&1 | tee "$RUNNER_TEMP/t3-ios-build.log"
      - name: Verify fresh release bundles and source provenance
        env:
          T3_IOS_NATIVE_CACHE_HIT: ${{ steps.project.outputs.native-cache-hit }}
        run: |
          set -euo pipefail
          node scripts/fork-ios-build.ts \
            --app "$RUNNER_TEMP/t3-ios-build/Build/Products/Release-iphoneos/T3CodeFork.app" \
            --build-number "$T3_IOS_BUILD_NUMBER" \
            --started-at "$(cat "$RUNNER_TEMP/t3-ios-build-started-at")" \
            --output "$RUNNER_TEMP/build-info.json"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/t3-ios-build/Build/Products/Release-iphoneos/T3CodeFork.app" \
            "$RUNNER_TEMP/T3-Code-Fork-iOS-unsigned.zip"
      - name: Upload unsigned app immediately
        uses: actions/upload-artifact@v7
        with:
          name: t3code-ios-unsigned
          path: |
            ${{ runner.temp }}/T3-Code-Fork-iOS-unsigned.zip
            ${{ runner.temp }}/build-info.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Report compiler cache statistics
        if: always() && steps.project.outcome == 'success'
        run: |
          ccache --cleanup
          ccache --show-stats
          ccache --print-stats > "$RUNNER_TEMP/t3-ios-ccache-stats.txt"
          du -sh "$CCACHE_DIR" "$RUNNER_TEMP/t3-ios-build" || true
          {
            echo '## iOS release build'
            echo 'Native project cache hit: ${{ steps.project.outputs.native-cache-hit }}'
            echo 'Native fingerprint: `${{ steps.fingerprint.outputs.hash }}`'
            echo '```'
            ccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save native project and Xcode outputs
        if: success() && steps.project.outputs.native-cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            apps/mobile/ios
            ${{ runner.temp }}/t3-ios-build
          key: fork-ios-native-${{ env.T3_IOS_CACHE_VERSION }}-${{ steps.toolchain.outputs.identity }}-${{ steps.fingerprint.outputs.hash }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
      - name: Save compiler cache
        if: always() && steps.native.outcome != 'skipped' && steps.project.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t3code-ios-log
          path: |
            ${{ runner.temp }}/t3-ios-build.log
            ${{ runner.temp }}/t3-ios-ccache-stats.txt
            ${{ runner.temp }}/t3-ios-build-started-at
          if-no-files-found: ignore
          retention-days: 7
